name: Deploy to GitHub Pages

# Trigger on push to main branch
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    # the site is hand-written static HTML — the build only copies files,
    # so there is nothing to install.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build
      run: npm run build

    # Fails the deploy on a dead link. Every CTA on this site hands off to
    # Kajabi or Calendly by hand-written URL, and those paths have gone 404
    # without anyone noticing — this is the check that notices.
    - name: Check links
      run: node scripts/check-links.mjs

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: nina-moore.com
        keep_files: true
        force_orphan: true