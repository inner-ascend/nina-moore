<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — Nina Moore</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Boska';font-style:normal;font-weight:200 900;font-display:swap;src:url(/assets/fonts/boska-normal.woff2) format('woff2-variations');}
@font-face{font-family:'Boska';font-style:italic;font-weight:200 900;font-display:swap;src:url(/assets/fonts/boska-italic.woff2) format('woff2-variations');}
:root{--ink:#1D2744;--ultra:#3A459D;--ochre:#9E7B37;--brass:#B6A73E;--parch:#E3DFCC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--parch);color:var(--ink);font-family:'Boska',Georgia,serif;
  font-size:21px;line-height:1.72;-webkit-font-smoothing:antialiased;padding:42px}
.mono{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
main{max-width:560px;text-align:center}
.eyebrow{display:block;color:var(--ochre);margin-bottom:15px}
.rule{border:0;height:1px;max-width:300px;margin:0 auto 30px;
  background:linear-gradient(90deg,rgba(158,123,55,0),var(--ochre) 50%,rgba(158,123,55,0))}
h1{font-size:clamp(32px,4.6vw,56px);font-weight:400;letter-spacing:-.014em;line-height:1.05;margin:0 0 28px}
em{font-style:italic;color:var(--ultra)}
p{margin:0 0 1.05em}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:40px}
.btn{display:inline-block;text-decoration:none;padding:16px 30px;font-family:'Courier Prime',monospace;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.btn-a{background:var(--ink);color:var(--parch)}
.btn-a:hover{background:var(--ultra)}
.btn-o{border:1px solid var(--ochre);color:var(--ochre);}
.btn-o:hover{border-color:var(--brass);color:var(--brass)}
a:focus-visible{outline:2px solid var(--ultra);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="eyebrow mono">404</span>
  <hr class="rule">
  <h1>This page has <em>moved on.</em></h1>
  <p>The thread you followed no longer leads anywhere. Everything is still here — just at a different door.</p>
  <div class="btns">
    <a class="btn btn-a" href="/">Return home</a>
    <a class="btn btn-o" href="mailto:hello@nina-moore.com">Write to me</a>
  </div>
</main>
</body>
</html>
